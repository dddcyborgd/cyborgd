# cyborgd behind Apache — the snippet the deltaverse.pythai.net vhost carries
# (DeltaVerse/deploy/web2/deltaverse.pythai.net.conf). Needs: a2enmod proxy proxy_http proxy_wstunnel rewrite headers.
# The daemon listens on 127.0.0.1:8790 only; the browser reaches it at wss://deltaverse.pythai.net/cyborg/ws
# and https://deltaverse.pythai.net/cyborg/api/… .

    # ── the cyborg/1 WebSocket: /cyborg/ws → ws://127.0.0.1:8790/ws ──
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/cyborg/ws$ ws://127.0.0.1:8790/ws [P,L]

    # ── the HTTP api: /cyborg/api/health · /rooms · /triad · /space/:id · /faucet/* · /llms.txt ──
    ProxyPreserveHost On
    ProxyPass        /cyborg/api http://127.0.0.1:8790/
    ProxyPassReverse /cyborg/api http://127.0.0.1:8790/
    ProxyTimeout 30

    # ── CSP: the page must be allowed to open the socket to its own origin over wss ──
    # add `wss://deltaverse.pythai.net` to the vhost's connect-src, e.g.
    # Header always set Content-Security-Policy "default-src 'self'; … connect-src 'self' wss://deltaverse.pythai.net; …"
